<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Turismo en Roma</title>
</head>


<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="imagenes/LOGO2.png" alt="Escudo SPQR Roma" class="logo-img">
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="ciudad.html">Ciudad</a></li>
                <li><a href="lugares.html">Lugares</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <button id="btnModo" class="btn-modo">Modo claro</button>
        </nav>
    </header>

    <main>
        <hr>

        <section id="contacto" class="seccion-contenido">
            <h2>Contactanos</h2>
            <p class="subtitulo">Completa el formulario y nos pondremos en contacto contigo.</p>

            <form id="formulario-contacto" class="tarjeta form-contacto">
                <div class="campo-form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo-form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                </div>

                <div class="campo-form">
                    <label for="Teléfono">Telefono:</label>
                    <input type="Teléfono" id="Teléfono" name="Teléfono" placeholder="+54 9 11 5489 4785" required>
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu consulta acá..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </section>

        <hr>

        <section class="seccion-contenido datos-extra">
            <h3>Contacto</h3>
            <p>Ubicación: Corrientes 7516, Ciudad Autónoma de Buenos Aires</p>
            <p>Teléfono: +54 9 11 7568-4651</p>
        </section>
    </main>

    <footer>
        <p>© 2026 sitio oficial de la ciudad. Todos los derechos reservados.</p>
    </footer>
    <script src="js/main.js"></script>
</body>

</html>
