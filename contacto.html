<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Turismo en Roma</title>
</head>
<body>
    <header>
        <h1><strong>Turismo en Roma</strong></h1>
        <nav>
            <a href="index.html">Inicio</a> | 
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h2>Ponte en contacto con nosotros</h2>
        
        <!-- Formulario de contacto -->
        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre completo:</label><br>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </p>
            
            <p>
                <label for="email">Correo Electrónico:</label><br>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </p>

            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
            </p>

            <p>
                <button type="submit">Enviar Mensaje</button>
            </p>
        </form>

        <hr>

        <!-- Datos adicionales -->
        <section>
            <h3>Otros medios de contacto</h3>
            <p><strong>Ubicación:</strong> Corrientes 7589, CABA</p>
            <p><strong>Teléfono / WhatsApp:</strong> +54 11 3029 2387</p>
            <p><strong>Email:</strong> contacto@turismoenroma.com</p>
        </section>
    </main>

</body>
</html>
